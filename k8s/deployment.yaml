apiVersion: apps/v1
kind: Deployment
metadata:
  name: tabularforge
  labels:
    app: tabularforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tabularforge
  template:
    metadata:
      labels:
        app: tabularforge
    spec:
      containers:
        - name: tabularforge
          image: tabularforge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: TABULARFORGE_BACKEND
              value: "cpu"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
