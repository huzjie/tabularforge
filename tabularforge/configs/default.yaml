# tabularforge default configuration
name: tabularforge
backend: mock            # mock | cpu | openai | vllm | transformers

model:
  dim: 64
  mlp_hidden: 128
  n_layers: 2
  max_columns: 8
  max_rows: 512
  vocab_size: 1024

scm:
  min_columns: 4
  max_columns: 8
  edge_prob: 0.35
  n_rows: 256
  seed: 42

train:
  epochs: 20
  lr: 0.05
  mask_prob: 0.15
  batch_size: 64
